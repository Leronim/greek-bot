<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f6f7f9; color:#17202a; }
      form { width:min(380px,calc(100vw - 32px)); padding:20px; background:#fff; border:1px solid #d9dee7; border-radius:8px; }
      h1 { margin:0 0 16px; font-size:24px; }
      input,button { width:100%; min-height:40px; border-radius:6px; font:inherit; }
      input { border:1px solid #d9dee7; padding:8px 10px; margin-bottom:12px; }
      button { border:0; background:#166534; color:#fff; cursor:pointer; }
      .error { color:#b42318; margin-bottom:12px; }
    </style>
  </head>
  <body>
    <form method="post" action="/login">
      <h1>Админка словаря</h1>
      {% if request.query_params.get("error") %}<div class="error">Неверный пароль</div>{% endif %}
      <input type="password" name="password" placeholder="Пароль" autofocus required>
      <button type="submit">Войти</button>
    </form>
  </body>
</html>
